org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# IMPORTANT: this project needs a DIFFERENT Gradle version than the 1.12.2
# project - Gradle 2.14 (required there by legacy ForgeGradle 2.x) is far
# too old for ForgeGradle 3.x here. Gradle 6.9 is the standard pairing for
# FG3/1.16.5-era projects and still runs fine under JDK 8. If you already
# installed Gradle 2.14 for the 1.12.2 project, install 6.9 separately
# (different folder, e.g. C:\Gradle\gradle-6.9) rather than replacing it -
# you may want both projects working at once.
#
# Same JDK-8 caveat as before applies: if `gradle -v` fails with
# "Could not determine java version from '21...'" or similar, point this
# at your JDK 8 install (forward slashes even on Windows):
# org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-8.0.504.1-hotspot
